name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger with approval

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Requires approval in GitHub settings

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t package/

      - name: Package Lambda
        run: |
          cd package && zip -r ../lambda.zip .
          cd .. && zip -g lambda.zip -r src/

      - name: Upload to S3
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.LAMBDA_S3_BUCKET }}/systems-bot/prod/lambda.zip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: infra/environments/prod
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/environments/prod
        run: |
          terraform plan \
            -var="lambda_s3_bucket=${{ secrets.LAMBDA_S3_BUCKET }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infra/environments/prod
        run: terraform apply -auto-approve tfplan

      - name: Update Lambda Functions
        run: |
          aws lambda update-function-code \
            --function-name prod-slack-events \
            --s3-bucket ${{ secrets.LAMBDA_S3_BUCKET }} \
            --s3-key systems-bot/prod/lambda.zip

          aws lambda update-function-code \
            --function-name prod-slack-interactive \
            --s3-bucket ${{ secrets.LAMBDA_S3_BUCKET }} \
            --s3-key systems-bot/prod/lambda.zip

          aws lambda update-function-code \
            --function-name prod-health \
            --s3-bucket ${{ secrets.LAMBDA_S3_BUCKET }} \
            --s3-key systems-bot/prod/lambda.zip

      - name: Output URLs
        working-directory: infra/environments/prod
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.event.release.tag_name || 'manual' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Slack Events URL:** $(terraform output -raw slack_events_url)" >> $GITHUB_STEP_SUMMARY
          echo "**Slack Interactive URL:** $(terraform output -raw slack_interactive_url)" >> $GITHUB_STEP_SUMMARY
          echo "**Health URL:** $(terraform output -raw health_url)" >> $GITHUB_STEP_SUMMARY
