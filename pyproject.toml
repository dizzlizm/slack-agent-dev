[project]
name = "systems-bot"
version = "2.0.0"
description = "AI-powered IT Support Assistant for Slack"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "package", ".venv"]

[tool.black]
line-length = 120
target-version = ["py311"]
