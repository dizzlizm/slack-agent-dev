AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Systems Bot

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Resources:
  SlackEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.slack_events.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /slack/events
            Method: POST

  SlackInteractiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.slack_interactive.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /slack/interactive
            Method: POST

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.health.lambda_handler
      Timeout: 10
      Events:
        Api:
          Type: Api
          Properties:
            Path: /health
            Method: GET
