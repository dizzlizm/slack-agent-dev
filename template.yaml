AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Systems Bot - AI-powered Slack bot for IT support and triage.
  Provides intelligent troubleshooting assistance, automated ticket routing,
  and conversation history management for IT support teams.

# ============================================================================
# PARAMETERS
# ============================================================================
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment (dev for development/testing, prod for production)

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: Number of days to retain CloudWatch logs before automatic deletion

# ============================================================================
# GLOBALS
# ============================================================================
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        USE_AWS_SECRETS: "true"
        AWS_REGION_NAME: !Ref AWS::Region
    Tags:
      Application: systems-bot
      Project: systems-bot
      Environment: !Ref Environment
      ManagedBy: aws-sam
      Component: lambda

# ============================================================================
# RESOURCES
# ============================================================================
Resources:

  # --------------------------------------------------------------------------
  # SECRETS MANAGER
  # --------------------------------------------------------------------------
  BotSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "systems-bot/${Environment}"
      Description: !Sub >-
        Credentials and API keys for Systems Bot (${Environment}).
        Contains Slack tokens, Anthropic API key, and other sensitive configuration.
      Tags:
        - Key: Application
          Value: systems-bot
        - Key: Project
          Value: systems-bot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aws-sam
        - Key: Component
          Value: secrets

  # --------------------------------------------------------------------------
  # DYNAMODB TABLES
  # --------------------------------------------------------------------------
  AuthorizedUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-AuthorizedUsers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Application
          Value: systems-bot
        - Key: Project
          Value: systems-bot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aws-sam
        - Key: Component
          Value: database
        - Key: Description
          Value: Stores authorized users and their permissions for bot access control

  ConversationHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-ConversationHistory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true
      Tags:
        - Key: Application
          Value: systems-bot
        - Key: Project
          Value: systems-bot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aws-sam
        - Key: Component
          Value: database
        - Key: Description
          Value: Stores chat message history for context-aware AI conversations

  TriageSessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-TriageSessions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: OriginalUserID
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: OriginalUserID
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true
      Tags:
        - Key: Application
          Value: systems-bot
        - Key: Project
          Value: systems-bot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aws-sam
        - Key: Component
          Value: database
        - Key: Description
          Value: Tracks IT support triage sessions and ticket escalation workflows

  # --------------------------------------------------------------------------
  # LAMBDA FUNCTIONS
  # --------------------------------------------------------------------------
  SlackEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-slack-events"
      Handler: src.handlers.slack_events.lambda_handler
      Description: !Sub >-
        Processes Slack Events API webhooks including messages, app mentions,
        and channel events. Routes to AI for intelligent response generation (${Environment}).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthorizedUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TriageSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref BotSecrets
      Events:
        SlackEvents:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /slack/events
            Method: POST

  SlackInteractiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-slack-interactive"
      Handler: src.handlers.slack_interactive.lambda_handler
      Description: !Sub >-
        Handles Slack interactive components including button clicks, modal submissions,
        and shortcut invocations for triage workflow actions (${Environment}).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthorizedUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TriageSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref BotSecrets
      Events:
        SlackInteractive:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /slack/interactive
            Method: POST

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-health"
      Handler: src.handlers.health.lambda_handler
      Description: !Sub >-
        Health check endpoint for monitoring and load balancer probes.
        Validates connectivity to dependent services (${Environment}).
      Timeout: 10
      MemorySize: 128
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref BotSecrets
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /health
            Method: GET

  # --------------------------------------------------------------------------
  # API GATEWAY
  # --------------------------------------------------------------------------
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${Environment}-systems-bot-api"
      StageName: !Ref Environment
      Description: !Sub >-
        REST API for Systems Bot Slack integration (${Environment}).
        Exposes webhook endpoints for Slack events, interactive callbacks, and health monitoring.
      Tags:
        Application: systems-bot
        Project: systems-bot
        Environment: !Ref Environment
        ManagedBy: aws-sam
        Component: api

  # --------------------------------------------------------------------------
  # CLOUDWATCH LOG GROUPS
  # --------------------------------------------------------------------------
  SlackEventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-slack-events"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: systems-bot
        - Key: Project
          Value: systems-bot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aws-sam
        - Key: Component
          Value: logging
        - Key: Function
          Value: slack-events

  SlackInteractiveLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-slack-interactive"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: systems-bot
        - Key: Project
          Value: systems-bot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aws-sam
        - Key: Component
          Value: logging
        - Key: Function
          Value: slack-interactive

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-health"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: systems-bot
        - Key: Project
          Value: systems-bot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aws-sam
        - Key: Component
          Value: logging
        - Key: Function
          Value: health

# ============================================================================
# OUTPUTS
# ============================================================================
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  SlackEventsUrl:
    Description: Slack Events webhook URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/slack/events"

  SlackInteractiveUrl:
    Description: Slack Interactive webhook URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/slack/interactive"

  HealthUrl:
    Description: Health check URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/health"

  SecretArn:
    Description: ARN of the Secrets Manager secret
    Value: !Ref BotSecrets

  AuthorizedUsersTableName:
    Description: DynamoDB table for authorized users
    Value: !Ref AuthorizedUsersTable

  ConversationHistoryTableName:
    Description: DynamoDB table for conversation history
    Value: !Ref ConversationHistoryTable

  TriageSessionsTableName:
    Description: DynamoDB table for triage sessions
    Value: !Ref TriageSessionsTable
